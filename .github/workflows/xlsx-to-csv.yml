name: xlsx to csv conversion
on:
  pull_request_target:
    types: [opened, reopened, synchronize]
  workflow_dispatch:
    inputs:
      message:
        description: 'Message for manually triggering'
        required: false
        default: 'Triggered for Updates'
        type: string

jobs:
  convert_xlsx_to_csv:
    runs-on: ubuntu-latest
    env:
      PR_NUMBER: ${{ github.event.number }}
      PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
      PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
      PR_USER_LOGIN: ${{ github.event.pull_request.user.login }}

    steps:
    - name: Check for xlsx changes
      id: check_xlsx
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "xlsx_changed=1" >> $GITHUB_OUTPUT
          exit 0
        fi

        FILES=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
          -H "Accept: application/vnd.github.v3+json" \
          "https://api.github.com/repos/${{ github.repository }}/pulls/${PR_NUMBER}/files")
        XLSX_CHANGED=$(echo "$FILES" | jq '[.[].filename | select(endswith(".xlsx"))] | length')
        echo "xlsx_changed=$XLSX_CHANGED" >> $GITHUB_OUTPUT

    - name: Clone the repository
      if: steps.check_xlsx.outputs.xlsx_changed != '0'
      run: |
        REPO_NAME=$(basename "$PR_HEAD_REPO")
        git clone -b "$PR_HEAD_REF" "https://github.com/${PR_HEAD_REPO}.git"
        echo "REPO_NAME=$REPO_NAME" >> $GITHUB_ENV
        echo "REPO_DIR=$GITHUB_WORKSPACE/$REPO_NAME" >> $GITHUB_ENV

    - name: Get author email
      id: get_email
      if: steps.check_xlsx.outputs.xlsx_changed != '0'
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "author_email=${{ github.actor }}@users.noreply.github.com" >> $GITHUB_OUTPUT
          exit 0
        fi

        commits=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
          -H "Accept: application/vnd.github.v3+json" \
          "https://api.github.com/repos/${{ github.repository }}/pulls/${PR_NUMBER}/commits")

        email=$(echo "$commits" | jq -r '.[0].commit.author.email // ""')

        if [ -z "$email" ] || [[ "$email" == *$'\n'* ]] || [[ "$email" == *"="* ]]; then
          email="${PR_USER_LOGIN}@users.noreply.github.com"
        fi

        echo "author_email=$email" >> $GITHUB_OUTPUT

    - name: Set up Git identity
      if: steps.check_xlsx.outputs.xlsx_changed != '0'
      run: |
        git config --global user.name "$PR_USER_LOGIN"
        git config --global user.email "${{ steps.get_email.outputs.author_email }}"

    - name: Install xlsx2csv
      if: steps.check_xlsx.outputs.xlsx_changed != '0'
      run: sudo apt-get install -y xlsx2csv

    - name: Debug directory structure
      if: steps.check_xlsx.outputs.xlsx_changed != '0'
      run: |
        echo "=== REPO_DIR: $REPO_DIR ==="
        ls -la "$REPO_DIR"
        echo "=== Looking for xlsx files ==="
        find "$REPO_DIR" -name "*.xlsx" | head -20

    - name: Create output directory and convert XLSX to CSV
      if: steps.check_xlsx.outputs.xlsx_changed != '0'
      run: |
        cd "$REPO_DIR"

        XLSX_DIR="mosip-data/mosip_master/xlsx"
        CSV_DIR="mosip-data/mosip_master_csv/csv"

        # Verify xlsx source directory exists
        if [ ! -d "$XLSX_DIR" ]; then
          echo "ERROR: Source directory $XLSX_DIR not found!"
          echo "Available directories:"
          find . -type d | head -30
          exit 1
        fi

        # Recreate csv output directory
        rm -rf "$CSV_DIR"
        mkdir -p "$CSV_DIR"

        # Check xlsx files exist
        shopt -s nullglob
        xlsx_files=("$XLSX_DIR"/*.xlsx)
        if [ ${#xlsx_files[@]} -eq 0 ]; then
          echo "No .xlsx files found in $XLSX_DIR"
          exit 0
        fi

        # Convert each xlsx to csv
        for xlsx_file in "${xlsx_files[@]}"; do
          filename=$(basename "$xlsx_file")
          csv_file="$CSV_DIR/${filename%.xlsx}.csv"
          echo "Converting $xlsx_file -> $csv_file"
          xlsx2csv "$xlsx_file" > "$csv_file"
          echo "Done: $csv_file ($(wc -l < "$csv_file") lines)"
        done

    - name: Commit and push changes
      if: steps.check_xlsx.outputs.xlsx_changed != '0'
      run: |
        cd "$REPO_DIR/mosip-data"
        git status
        git add .
        git commit -s -m "Added converted CSV files" || echo "No changes to commit"
        git push "https://x-access-token:${{ secrets.ACTION_PAT }}@github.com/${PR_HEAD_REPO}.git" "HEAD:${PR_HEAD_REF}"
